<title>レンチンくん</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:             #f7f4f0;
    --card:           #ffffff;
    --product-bg:     #fff5f7;
    --product-border: #f5c6d0;
    --product-color:  #e05c7a;
    --myrange-bg:     #f3f7ff;
    --myrange-border: #bdd4f8;
    --myrange-color:  #3a7bd5;
    --result-bg:      #f5f3ff;
    --result-border:  #cec6f8;
    --result-color:   #7c6fe0;
    --text:           #2e2828;
    --text-sub:       #9a9090;
    --border:         #ede8e4;
    --btn-bg:         #f0ece8;
    --btn-color:      #9e9390;
    --shadow:         rgba(0,0,0,0.06);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { color-scheme: light only; }
  html, body {
    width:100%; height:100%;
    background: var(--bg); color: var(--text);
    font-family: 'Zen Maru Gothic', sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:10px 14px;
  }
  .app {
    width:100%; max-width:390px;
    display:flex; flex-direction:column; gap:8px;
  }

  /* ヘッダー */
  .header { text-align:center; padding:0 0 2px; }
  .header .emoji { font-size:24px; animation:wiggle 3s ease-in-out infinite; display:inline-block; }
  .header h1 { font-size:19px; font-weight:900; color:var(--product-color); letter-spacing:0.04em; }
  .header .subtitle { font-size:10px; color:var(--text-sub); margin-top:2px; }
  @keyframes wiggle {
    0%,100% { transform:rotate(-4deg); }
    50%      { transform:rotate(4deg); }
  }

  /* カード */
  .card { border-radius:16px; padding:11px 14px; box-shadow:0 2px 10px var(--shadow); }
  .card.product { background:var(--product-bg); border:1.5px solid var(--product-border); }
  .card.myrange  { background:var(--myrange-bg);  border:1.5px solid var(--myrange-border); }

  .card-label {
    font-size:10px; font-weight:700; letter-spacing:0.1em;
    display:flex; align-items:center; gap:6px; margin-bottom:8px;
  }
  .card.product .card-label { color:var(--product-color); }
  .card.myrange  .card-label { color:var(--myrange-color); }
  .step-num {
    width:18px; height:18px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:900; color:#fff; flex-shrink:0;
  }
  .card.product .step-num { background:var(--product-color); }
  .card.myrange  .step-num { background:var(--myrange-color); }
  .badge { padding:2px 7px; border-radius:20px; font-size:10px; font-weight:700; }
  .card.product .badge { background:var(--product-color); color:#fff; }
  .card.myrange  .badge { background:var(--myrange-color); color:#fff; }

  /* 時間ピッカー */
  .time-row { display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:9px; }
  .picker-wrap { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .picker-unit { font-size:9px; color:var(--text-sub); font-weight:700; }
  .picker-box {
    background:var(--card); border:1.5px solid var(--product-border);
    border-radius:10px; overflow:hidden; width:64px;
    box-shadow:0 1px 4px var(--shadow);
  }
  .card.myrange .picker-box { border-color:var(--myrange-border); }
  .picker-arrow {
    background:none; border:none;
    font-size:13px; width:100%; padding:7px 0;
    cursor:pointer; line-height:1; color:var(--text-sub);
    transition:background 0.12s;
    -webkit-user-select:none; user-select:none;
  }
  .picker-arrow:hover { background:var(--border); }
  .picker-arrow:active { background:var(--border); }
  .picker-val {
    font-family:'Nunito',sans-serif;
    font-size:28px; font-weight:900;
    text-align:center; padding:4px 0; line-height:1;
  }
  .card.product .picker-val { color:var(--product-color); }
  .card.myrange  .picker-val { color:var(--myrange-color); }
  .time-sep { font-size:20px; font-weight:700; color:var(--text-sub); margin-top:20px; }

  /* リセットボタン */
  .reset-btn {
    display:block; margin:5px auto 0;
    background:none; border:none;
    font-size:10px; color:var(--text-sub);
    cursor:pointer; text-decoration:underline;
    font-family:'Zen Maru Gothic',sans-serif;
  }

  /* Wattボタン */
  .watt-label { font-size:9px; color:var(--text-sub); font-weight:700; margin-bottom:5px; }
  .watt-scroll { display:flex; flex-wrap:wrap; gap:6px; }
  .watt-btn {
    background:var(--btn-bg); border:1.5px solid transparent;
    border-radius:20px; color:var(--btn-color);
    font-family:'Nunito',sans-serif; font-size:11px; font-weight:700;
    padding:5px 6px; cursor:pointer; transition:all 0.13s;
    white-space:nowrap; flex:1; text-align:center;
  }
  .card.product .watt-btn:hover  { border-color:var(--product-color); color:var(--product-color); }
  .card.product .watt-btn.active { background:var(--product-color); border-color:var(--product-color); color:#fff; box-shadow:0 2px 6px rgba(224,92,122,0.3); }
  .card.myrange  .watt-btn:hover  { border-color:var(--myrange-color); color:var(--myrange-color); }
  .card.myrange  .watt-btn.active { background:var(--myrange-color); border-color:var(--myrange-color); color:#fff; box-shadow:0 2px 6px rgba(58,123,213,0.3); }

  /* カスタム */
  .custom-row { display:flex; gap:6px; margin-top:7px; }
  .custom-input {
    flex:1; background:var(--card); border:1.5px solid var(--myrange-border);
    border-radius:20px; color:var(--text);
    font-family:'Nunito',sans-serif; font-size:12px;
    padding:5px 11px; outline:none;
    -webkit-appearance:none; -moz-appearance:textfield;
  }
  .custom-input::-webkit-inner-spin-button,
  .custom-input::-webkit-outer-spin-button { -webkit-appearance:none; }
  .custom-input::placeholder { color:var(--text-sub); font-size:10px; opacity:0.7; }
  .custom-input:focus { border-color:var(--myrange-color); }
  .save-btn {
    background:var(--myrange-color); border:none; border-radius:20px;
    color:#fff; font-family:'Zen Maru Gothic',sans-serif;
    font-size:10px; font-weight:700; padding:5px 12px;
    cursor:pointer; white-space:nowrap;
  }

  /* 保存済み */
  .saved-wrap { margin-top:7px; }
  .saved-title { font-size:9px; color:var(--text-sub); font-weight:700; margin-bottom:4px; }
  .saved-list { display:flex; flex-wrap:wrap; gap:4px; }
  .saved-chip {
    display:flex; align-items:center; gap:3px;
    background:var(--card); border:1.5px solid var(--myrange-border);
    border-radius:20px; padding:2px 8px;
    font-family:'Nunito',sans-serif; font-size:11px; color:var(--text);
  }
  .use-btn { background:none; border:none; color:var(--myrange-color); cursor:pointer; font-size:10px; font-weight:700; padding:0; }
  .del-btn { background:none; border:none; color:var(--text-sub); cursor:pointer; font-size:11px; padding:0 0 0 1px; opacity:0.5; }
  .del-btn:hover { color:var(--product-color); opacity:1; }

  /* 矢印 */
  .arrow-div { text-align:center; font-size:18px; animation:bounce 1.6s ease-in-out infinite; line-height:1; }
  @keyframes bounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(4px); } }

  /* 結果 */
  .result-card {
    background:var(--result-bg); border:1.5px solid var(--result-border);
    border-radius:16px; padding:12px 14px;
    text-align:center; box-shadow:0 2px 10px var(--shadow);
    cursor:pointer; transition:transform 0.1s;
  }
  .result-card:active { transform:scale(0.98); }
  .result-label { font-size:9px; font-weight:700; letter-spacing:0.12em; color:var(--result-color); margin-bottom:2px; }
  .result-empty { color:var(--text-sub); font-size:12px; padding:4px 0; }
  .result-time {
    font-family:'Nunito',sans-serif;
    font-size:50px; font-weight:900; line-height:1;
    color:var(--result-color);
    animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .result-sub { font-size:10px; color:var(--text-sub); margin-top:3px; }
  .result-copy { font-size:9px; color:var(--result-color); margin-top:4px; opacity:0.7; }
  .result-note { font-size:9px; color:var(--text-sub); opacity:0.55; margin-top:6px; padding-top:6px; border-top:1px solid var(--result-border); }
  .copied-toast {
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    background:var(--result-color); color:#fff;
    padding:8px 20px; border-radius:20px;
    font-size:12px; font-weight:700;
    opacity:0; transition:opacity 0.3s;
    pointer-events:none; z-index:999;
  }
  .copied-toast.show { opacity:1; }

  @keyframes popIn {
    from { opacity:0; transform:scale(0.75); }
    to   { opacity:1; transform:scale(1); }
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div><span class="emoji">🍱</span> <span style="font-size:19px;font-weight:900;color:var(--product-color);letter-spacing:0.04em;">レンチンくん</span></div>
    <div class="subtitle">商品表示のW数 → あなたのレンジの時間に変換</div>
  </div>

  <div class="card product">
    <div class="card-label">
      <span class="step-num">1</span>
      <span class="badge">商品</span>パッケージの表示
    </div>
    <div class="time-row">
      <div class="picker-wrap">
        <div class="picker-unit">分</div>
        <div class="picker-box">
          <button class="picker-arrow" id="minUp">▲</button>
          <div class="picker-val" id="dispMin">3</div>
          <button class="picker-arrow" id="minDown">▼</button>
        </div>
      </div>
      <div class="time-sep">:</div>
      <div class="picker-wrap">
        <div class="picker-unit">秒</div>
        <div class="picker-box">
          <button class="picker-arrow" id="secUp">▲</button>
          <div class="picker-val" id="dispSec">00</div>
          <button class="picker-arrow" id="secDown">▼</button>
        </div>
      </div>
    </div>
    <button class="reset-btn" onclick="resetTime()">🔄 時間をリセット</button>
    <div class="watt-label" style="margin-top:9px;">📦 商品記載のW数</div>
    <div class="watt-scroll" id="productWattBtns"></div>
  </div>

  <div class="arrow-div">⬇️</div>

  <div class="card myrange">
    <div class="card-label">
      <span class="step-num">2</span>
      <span class="badge">レンジ</span>あなたのレンジ
    </div>
    <div class="watt-label">🔥 自分のレンジのW数</div>
    <div class="watt-scroll" id="myrangeWattBtns"></div>
    <div class="custom-row">
      <input class="custom-input" type="number" id="customWatt" placeholder="その他のW数を入力…" min="100" max="3000">
      <button class="save-btn" onclick="saveCustomWatt()">＋保存</button>
    </div>
    <div class="saved-wrap" id="savedWrap" style="display:none;">
      <div class="saved-title">⭐ 保存したW数</div>
      <div class="saved-list" id="savedList"></div>
    </div>
  </div>

  <div class="result-card">
    <div class="result-label">✨ 変換結果</div>
    <div id="resultEmpty" class="result-empty">上の項目を入力してね</div>
    <div id="resultContent" style="display:none;">
      <div class="result-time" id="resultTime"></div>
      <div class="result-sub"  id="resultSub"></div>
      <div class="result-note">※ 目安時間です。食品の状態により調整してください</div>
    </div>
  </div>
  <div style="text-align:center; padding:4px 0 2px; font-size:10px; color:var(--text-sub); opacity:0.5; font-family:'Nunito',sans-serif;">made with 🍱 by のりお</div>

</div>


<script>
  const PRESETS = [500, 600, 700, 800, 1000, 1500];
  let prodMin = 3, prodSec = 0;
  let selProdW = 500, selMyW = 600;
  let savedWatts = JSON.parse(localStorage.getItem('savedWatts') || '[]');
  let repeatTimer = null;
  let repeatInterval = null;

  // 長押し連続変更
  function startRepeat(field, delta) {
    changeTime(field, delta);
    repeatTimer = setTimeout(() => {
      repeatInterval = setInterval(() => changeTime(field, delta), 80);
    }, 400);
  }
  function stopRepeat() {
    clearTimeout(repeatTimer);
    clearInterval(repeatInterval);
  }

  function bindPicker(id, field, delta) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault(); // mousedownの二重発火を防ぐ
      startRepeat(field, delta);
    }, { passive: false });
    btn.addEventListener('touchend', stopRepeat);
    btn.addEventListener('mousedown', startRepeat.bind(null, field, delta));
    btn.addEventListener('mouseup', stopRepeat);
    btn.addEventListener('mouseleave', stopRepeat);
  }

  function changeTime(field, delta) {
    if (field === 'min') {
      prodMin = Math.max(0, Math.min(30, prodMin + delta));
      document.getElementById('dispMin').textContent = prodMin;
    } else {
      prodSec += delta;
      if (prodSec >= 60) prodSec = 0;
      if (prodSec < 0)   prodSec = 50;
      document.getElementById('dispSec').textContent = String(prodSec).padStart(2,'0');
    }
    calculate();
  }

  function resetTime() {
    prodMin = 0; prodSec = 0;
    document.getElementById('dispMin').textContent = 0;
    document.getElementById('dispSec').textContent = '00';
    calculate();
  }

  function renderBtns(id, selected, type) {
    const el = document.getElementById(id);
    el.innerHTML = '';
    PRESETS.forEach(w => {
      const b = document.createElement('button');
      b.className = 'watt-btn' + (w === selected ? ' active' : '');
      b.textContent = w + 'W';
      b.onclick = () => selectW(type, w);
      el.appendChild(b);
    });
  }

  function selectW(type, w) {
    if (type === 'prod') { selProdW = w; renderBtns('productWattBtns', selProdW, 'prod'); }
    else { selMyW = w; renderBtns('myrangeWattBtns', selMyW, 'my'); document.getElementById('customWatt').value = ''; }
    calculate();
  }

  function saveCustomWatt() {
    const v = parseInt(document.getElementById('customWatt').value);
    if (!v || v < 100 || v > 3000) return;
    if (!savedWatts.includes(v)) { savedWatts.push(v); localStorage.setItem('savedWatts', JSON.stringify(savedWatts)); }
    selMyW = v;
    document.getElementById('customWatt').value = '';
    renderBtns('myrangeWattBtns', -1, 'my');
    renderSaved(); calculate();
  }

  function renderSaved() {
    const wrap = document.getElementById('savedWrap');
    const list = document.getElementById('savedList');
    if (!savedWatts.length) { wrap.style.display='none'; return; }
    wrap.style.display = 'block'; list.innerHTML = '';
    savedWatts.forEach(w => {
      const chip = document.createElement('div');
      chip.className = 'saved-chip';
      chip.innerHTML = `<span>${w}W</span><button class="use-btn" onclick="useSaved(${w})">使う</button><button class="del-btn" onclick="delSaved(${w})">✕</button>`;
      list.appendChild(chip);
    });
  }

  function useSaved(w) { selMyW = w; renderBtns('myrangeWattBtns', -1, 'my'); calculate(); }
  function delSaved(w) { savedWatts = savedWatts.filter(x => x !== w); localStorage.setItem('savedWatts', JSON.stringify(savedWatts)); renderSaved(); }

  let currentResult = '';

  function calculate() {
    const total = prodMin * 60 + prodSec;
    const empty = document.getElementById('resultEmpty');
    const content = document.getElementById('resultContent');
    if (total === 0) { empty.style.display='block'; content.style.display='none'; currentResult=''; return; }
    const conv = total * selProdW / selMyW;
    const totalConv = Math.ceil(conv / 10) * 10;
    const m = Math.floor(totalConv / 60), s = totalConv % 60;
    let str = m > 0 ? m + '分' : '';
    str += String(s).padStart(2,'0') + '秒';
    currentResult = str + '（' + selProdW + 'W→' + selMyW + 'W）';
    document.getElementById('resultTime').textContent = str;
    document.getElementById('resultSub').textContent = `${selProdW}W × ${prodMin}分${String(prodSec).padStart(2,'0')}秒 → ${selMyW}W`;
    empty.style.display = 'none'; content.style.display = 'block';
    const rt = document.getElementById('resultTime');
    rt.style.animation = 'none'; rt.offsetHeight;
    rt.style.animation = 'popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both';
    // 振動フィードバック
    if (navigator.vibrate) navigator.vibrate(30);
  }

  document.getElementById('customWatt').addEventListener('input', function() {
    const v = parseInt(this.value);
    if (v >= 100 && v <= 3000) { selMyW = v; renderBtns('myrangeWattBtns', -1, 'my'); calculate(); }
  });

  bindPicker('minUp',   'min',  1);
  bindPicker('minDown', 'min', -1);
  bindPicker('secUp',   'sec',  10);
  bindPicker('secDown', 'sec', -10);
  renderBtns('productWattBtns', selProdW, 'prod');
  renderBtns('myrangeWattBtns', selMyW, 'my');
  renderSaved();
  calculate();
</script>
</body>
</html>
